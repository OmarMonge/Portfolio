<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Explorer</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        background: #0a0a0a;
        color: #e0e0e0;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-columns: 280px 1fr 420px;
        height: 100vh;
        gap: 1px;
        background: #222;
      }
      .panel {
        background: #0a0a0a;
        padding: 16px;
        overflow-y: auto;
      }
      .panel h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
        margin-bottom: 12px;
      }
      #canvas-container {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
      }
      #shader-canvas {
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
      }
      #seed-display {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-size: 11px;
        color: #666;
        background: rgba(0,0,0,0.7);
        padding: 4px 8px;
        border-radius: 2px;
      }
      .control {
        margin-bottom: 14px;
      }
      .control label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #aaa;
        margin-bottom: 4px;
      }
      .control input[type="range"] {
        width: 100%;
        accent-color: #5cf;
      }
      .control input[type="number"], .control input[type="text"] {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        color: #e0e0e0;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 12px;
        border-radius: 2px;
      }
      button {
        background: #1a1a1a;
        border: 1px solid #333;
        color: #e0e0e0;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        border-radius: 2px;
        width: 100%;
        margin-bottom: 6px;
        transition: all 0.1s;
      }
      button:hover { border-color: #5cf; color: #5cf; }
      button.primary { background: #5cf; color: #000; border-color: #5cf; }
      button.primary:hover { background: #7df; color: #000; }
      #code-output {
        font-size: 10px;
        line-height: 1.4;
        color: #888;
        white-space: pre-wrap;
        word-break: break-all;
        background: #0f0f0f;
        padding: 10px;
        border: 1px solid #222;
        border-radius: 2px;
        max-height: 300px;
        overflow-y: auto;
      }
      #ast-tree {
        font-size: 11px;
        line-height: 1.5;
        color: #aaa;
        white-space: pre;
        font-family: ui-monospace, monospace;
      }
      .stats { font-size: 11px; color: #888; line-height: 1.6; }
      .stats span { color: #5cf; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="panel" id="controls-panel">
        <h2>Controls</h2>
        <div class="control">
          <label>Seed <span id="seed-value">—</span></label>
          <input type="text" id="seed-input" placeholder="random" />
        </div>
        <div class="control">
          <label>Depth <span id="depth-value">4</span></label>
          <input type="range" id="depth-slider" min="2" max="6" value="4" />
        </div>
        <button class="primary" id="regenerate-btn">Regenerate (G)</button>
        <button id="reset-weights-btn">Reset weights</button>

        <h2 style="margin-top: 24px;">Operator weights</h2>
        <div id="operator-weights"></div>

        <h2 style="margin-top: 24px;">Stats</h2>
        <div class="stats" id="stats-output">—</div>
      </aside>

      <main id="canvas-container">
        <canvas id="shader-canvas" width="720" height="720"></canvas>
        <div id="seed-display">seed: —</div>
      </main>

      <aside class="panel" id="inspector-panel">
        <h2>AST</h2>
        <div id="ast-tree">—</div>

        <h2 style="margin-top: 24px;">Generated WGSL</h2>
        <div id="code-output">—</div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
